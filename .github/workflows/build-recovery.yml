name: Plan or build Xiaomi recoveries

# Staging branch: manual planning only by default. No push/PR build trigger.
on:
  workflow_dispatch:
    inputs:
      devices:
        description: 'Comma-separated devices; all requested devices must be ready'
        type: string
        default: 'dipper,perseus,equuleus'
      execute:
        description: 'Compile only after every selected target is enabled and validated'
        type: boolean
        default: false
      mode:
        description: 'Each device must validate this mode independently'
        type: choice
        options: [storage, diagnostic]
        default: storage
      max_parallel:
        description: 'Maximum concurrent device builds'
        type: choice
        options: ['1', '2', '3']
        default: '3'
      jobs:
        description: 'Compile jobs inside each independent runner'
        type: choice
        options: ['1', '2', '3', '4']
        default: '2'

permissions:
  contents: read

concurrency:
  group: xiaomi-recovery-batch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.matrix.outputs.ready }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout build orchestration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Validate all requested devices without building
        id: matrix
        shell: bash
        env:
          REQUESTED_DEVICES: ${{ inputs.devices }}
          REQUESTED_MODE: ${{ inputs.mode }}
          RUN_BUILD: ${{ inputs.execute }}
        run: |
          set -euo pipefail
          args=(--devices "$REQUESTED_DEVICES" --mode "$REQUESTED_MODE" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY")
          if [[ "$RUN_BUILD" == true ]]; then args+=(--require-ready); fi
          python3 tools/plan-recoveries.py "${args[@]}"

  recovery:
    name: Build ${{ matrix.device }}
    needs: plan
    if: ${{ inputs.execute && needs.plan.outputs.ready == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      BUILD_MODE: ${{ matrix.mode }}
      CRYPTO_PROFILE: ''
      RECOVERY_DEVICE_PRODUCT: ${{ matrix.product }}
      TARGET_SOURCE_LOCK: ${{ matrix.source_lock }}
      DIPPER_LUNCH: ${{ matrix.lunch }}
      DIPPER_JOBS: ${{ inputs.jobs || '2' }}
      DIPPER_SYNC_JOBS: '4'
      # -j does not bound Soong's Go heap or goroutine parallelism.
      GOMEMLIMIT: '10GiB'
      GOGC: '50'
      GOMAXPROCS: '2'
      ANDROID_SOURCE: ${{ github.workspace }}/android-source
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device-tree
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}

      - name: Validate device tree contract and configure mode
        shell: bash
        run: |
          set -euo pipefail
          test -f device-tree/AndroidProducts.mk
          test -f device-tree/PREBUILTS.sha256
          grep -Fq "twrp_$RECOVERY_DEVICE_PRODUCT" device-tree/AndroidProducts.mk
          python3 device-tree/tools/ci-configure.py

      - name: Prepare ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          # Only unused SDKs on this disposable Actions runner are removed.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /opt/az
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gperf lib32ncurses-dev lib32z1-dev libelf-dev liblz4-tool libssl-dev libxml2-utils lzop python3 rsync unzip xsltproc zip zlib1g-dev
          mkdir -p "$HOME/.local/bin"
          curl --fail --location --retry 4 https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/.local/bin/repo"
          chmod +x "$HOME/.local/bin/repo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          git config --global user.name 'Recovery Builder'
          git config --global user.email 'recovery-builder@users.noreply.github.com'
          # Bound memory pressure; Android/Soong may need more than runner RAM.
          sudo fallocate -l 24G /swapfile-dipper
          sudo chmod 600 /swapfile-dipper
          sudo mkswap /swapfile-dipper
          sudo swapon /swapfile-dipper
          df -h
          free -h
          test "$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -1)" -gt 55000000000

      - name: Sync pinned recovery sources and prebuilts
        shell: bash
        run: |
          set -euo pipefail
          bash device-tree/tools/sync-source.sh "$ANDROID_SOURCE" 2>&1 | tee "$GITHUB_WORKSPACE/source-sync.log"

      - name: Reclaim synced Git storage and check build headroom
        shell: bash
        run: |
          set -euo pipefail
          bash device-tree/tools/ci-reclaim-space.sh "$ANDROID_SOURCE" 2>&1 | tee "$GITHUB_WORKSPACE/disk-cleanup.log"

      - name: Build recovery image
        timeout-minutes: 300
        shell: bash
        run: |
          set -euo pipefail
          bash device-tree/tools/ci-build.sh "$ANDROID_SOURCE"

      - name: Package image and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "$ANDROID_SOURCE/out/target/product/$RECOVERY_DEVICE_PRODUCT/recovery.img" "artifacts/twrp-$RECOVERY_DEVICE_PRODUCT-$BUILD_MODE.img"
          cp device-tree/crypto-profile.json artifacts/
          cp "$ANDROID_SOURCE/$TARGET_SOURCE_LOCK" artifacts/
          cp device-tree/PREBUILTS.sha256 artifacts/
          git -C device-tree rev-parse HEAD > artifacts/device-tree-commit.txt
          (cd artifacts && sha256sum *.img > SHA256SUMS)
          echo "Built device: $RECOVERY_DEVICE_PRODUCT, mode: $BUILD_MODE. Storage mode mounts unencrypted data; decrypt mode requires the actual ROM profile." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload recovery image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-${{ matrix.device }}-${{ env.BUILD_MODE }}-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}-build-logs-${{ github.run_number }}
          path: |
            source-sync.log
            disk-cleanup.log
            build-console.log
            resource-usage.log
            runner-diagnostics.txt
            android-source/${{ matrix.product }}-recovery-build.log
            android-source/${{ matrix.source_lock }}
            android-source/out/error.log
            android-source/out/soong.log
            device-tree/crypto-profile.json
          if-no-files-found: warn
          retention-days: 14
