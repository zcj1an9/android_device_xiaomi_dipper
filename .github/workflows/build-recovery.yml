name: Build equuleus TWRP

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'storage: unencrypted data; diagnostic: omit data'
        type: choice
        options: [storage, diagnostic]
        default: storage
      jobs:
        description: 'Parallel compile jobs (1-4)'
        type: choice
        options: ['1', '2', '3', '4']
        default: '2'

permissions:
  contents: read

concurrency:
  group: equuleus-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recovery:
    if: github.ref == 'refs/heads/twrp-16.0-equuleus'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      BUILD_MODE: ${{ inputs.mode || 'storage' }}
      RECOVERY_JOBS: ${{ inputs.jobs || '2' }}
      RECOVERY_SYNC_JOBS: '4'
      # -j does not bound Soong's Go heap or goroutine parallelism.
      GOMEMLIMIT: '10GiB'
      GOGC: '50'
      GOMAXPROCS: '2'
      ANDROID_SOURCE: ${{ github.workspace }}/android-source
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device-tree
          ref: ${{ github.sha }}

      - name: Configure recovery mode
        run: |
          python3 device-tree/tools/configure-storage.py --mode "$BUILD_MODE"
          python3 device-tree/tools/preflight.py --source-only

      - name: Prepare ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          # Only unused SDKs on this disposable Actions runner are removed.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /opt/az
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gperf lib32ncurses-dev lib32z1-dev libelf-dev liblz4-tool libssl-dev libxml2-utils lzop python3 rsync unzip xsltproc zip zlib1g-dev
          mkdir -p "$HOME/.local/bin"
          curl --fail --location --retry 4 https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/.local/bin/repo"
          chmod +x "$HOME/.local/bin/repo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          git config --global user.name 'Recovery Builder'
          git config --global user.email 'recovery-builder@users.noreply.github.com'
          # Bound memory pressure; Android/Soong may need more than runner RAM.
          sudo fallocate -l 24G /swapfile-equuleus
          sudo chmod 600 /swapfile-equuleus
          sudo mkswap /swapfile-equuleus
          sudo swapon /swapfile-equuleus
          df -h
          free -h
          test "$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -1)" -gt 55000000000

      - name: Sync pinned recovery sources and prebuilts
        shell: bash
        run: |
          set -euo pipefail
          bash device-tree/tools/sync-source.sh "$ANDROID_SOURCE" 2>&1 | tee "$GITHUB_WORKSPACE/source-sync.log"

      - name: Reclaim synced Git storage and check build headroom
        shell: bash
        run: |
          set -euo pipefail
          bash device-tree/tools/ci-reclaim-space.sh "$ANDROID_SOURCE" 2>&1 | tee "$GITHUB_WORKSPACE/disk-cleanup.log"

      - name: Build recovery image
        timeout-minutes: 300
        shell: bash
        run: |
          set -euo pipefail
          bash device-tree/tools/ci-build.sh "$ANDROID_SOURCE"

      - name: Package image and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "$ANDROID_SOURCE/out/target/product/equuleus/recovery.img" "artifacts/twrp-equuleus-$BUILD_MODE.img"
          cp device-tree/crypto-profile.json artifacts/
          cp "$ANDROID_SOURCE/equuleus-source-lock.xml" artifacts/
          cp device-tree/PREBUILTS.sha256 artifacts/
          git -C device-tree rev-parse HEAD > artifacts/device-tree-commit.txt
          (cd artifacts && sha256sum *.img > SHA256SUMS)
          echo "Built mode: $BUILD_MODE. Storage mode mounts unencrypted data; decrypt mode requires the actual ROM profile." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload recovery image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-equuleus-${{ env.BUILD_MODE }}-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equuleus-build-logs-${{ github.run_number }}
          path: |
            source-sync.log
            disk-cleanup.log
            build-console.log
            resource-usage.log
            runner-diagnostics.txt
            android-source/equuleus-recovery-build.log
            android-source/equuleus-source-lock.xml
            android-source/out/error.log
            android-source/out/soong.log
            device-tree/crypto-profile.json
          if-no-files-found: warn
          retention-days: 14

